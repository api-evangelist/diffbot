    rather than name one entity ('public semiconductor companies in Texas with over 500 employees', 'articles
    mentioning a person since June'), where search_web returns pages and enhance only resolves a single
    kno…
- name: dql_ontology
  summary: Look up entity types, fields, taxonomies and enums so a dql query can be written against field
    paths that actually exist.
  required:
  - action
  parameters:
