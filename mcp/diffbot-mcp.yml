name: Diffbot MCP Server
description: Diffbot's first-party MCP server. Exposes the Extract, Web Search, Knowledge Graph (Enhance
  / DQL), Crawl and Natural Language surfaces as seven agent tools. Diffbot operates a hosted remote endpoint
  and also ships the same server as a local stdio process from the diffbot-mcp repository — the repo deploys
  directly to the remote.
status: published
deployment:
  mode: both
  endpoint: https://mcp.diffbot.com/mcp
  install: python3 diffbot_mcp_server.py
  package: https://github.com/diffbot/diffbot-mcp
  auth: api-key
  verified: probed
  note: 'Remote: an MCP client POSTs to https://mcp.diffbot.com/mcp with the Diffbot token supplied as
    a ?token= query parameter. Local: clone the repo, `pip install .`, then run diffbot_mcp_server.py
    over stdio with DIFFBOT_TOKEN in the environment; a Dockerfile is provided. Both are documented by
    Diffbot in the repository README. The package is NOT on PyPI (404 as of 2026-09-06), so `pip install
    diffbot-mcp` does not work.'
