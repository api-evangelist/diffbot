description: Versioning, deprecation, status and change-communication practice for the Diffbot APIs.
versioning:
  scheme: uri-path
  policy_published: false
  note: >-
    Version is a path segment and differs by surface. Diffbot publishes no written versioning
    policy — no statement of what constitutes a breaking change, no support window, no
    minimum notice period. The versions below are read from the specs themselves.
  surfaces:
