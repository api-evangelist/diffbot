      spec_version: 1.1.0
      path_version: v3
      server: https://api.diffbot.com/v3
    - api: Crawl API
      spec_version: '1.1'
      path_version: v3
      server: https://api.diffbot.com/v3
    - api: Bulk Extract API
      spec_version: '1.1'
      path_version: v3
      server: https://api.diffbot.com/v3
    - api: Account API
      spec_version: '1.1'
      path_version: v4
      server: https://api.diffbot.com/v4
    - api: DQL API
      spec_version: 1.0.0
      path_version: v3
      server: https://kg.diffbot.com/kg/v3
    - api: ENHANCE API
      spec_version: 3.0.0
      path_version: v3
      server: https://kg.diffbot.com/kg/v3
    - api: Natural Language API
      spec_version: 1.0.0
