deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  practice: documented-per-endpoint
  docs: https://www.diffbot.com/docs/dql/migrating-from-legacy-api
  note: >-
    Diffbot has no written deprecation POLICY and emits no RFC 8594 Sunset/Deprecation
    headers. It does document deprecations when they happen, with a migration guide and an
    explicit no-shutoff commitment — recorded here as the practice that actually exists.
  deprecated:
    - surface: Legacy DQL endpoint
      endpoint: https://kg.diffbot.com/kg/dql_endpoint
      deprecated_on: 2022-Q4
      status: still-serving
      replacement: https://kg.diffbot.com/kg/v3/dql
      sunset_date: null
      migration_guide: https://www.diffbot.com/docs/dql/migrating-from-legacy-api
      note: >-
        Diffbot's own wording: "deprecated in Q4 2022. It continues to work but new features
        and performance improvements are only added to the new v3 API." Four years on, no
        sunset date has been announced. Response shape changed (entities moved under an
        `entity` wrapper in `data[]`), which the guide documents.
  deprecated_operations_in_spec: []
  deprecated_operations_note: >-
    No operation in any of the eight published OpenAPI documents carries `deprecated: true`.
status_page:
  published: true
  url: https://status.diffbot.com/
  http_status: 200
  provider: Pingdom Public Reports
  history_window: 7 days
  components_note: >-
    A Pingdom uptime board rather than a full incident-communication status page: it shows
    per-service up/disrupted/outage bars for the last seven days. There is no incident
    history, no scheduled-maintenance calendar, no subscribe/webhook feed, and no
    machine-readable status endpoint an agent could poll.
  checked: '2026-09-06'
sla:
  published: false
  note: >-
    No SLA, uptime commitment or credit-for-downtime term is published on the pricing page or
    in the terms. Enterprise plans advertise "dedicated support" and custom rate limits; any
    SLA is presumably contractual and not public.
