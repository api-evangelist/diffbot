  - Extraction
  - Harvesting
  - Scraping
  properties:
  - type: Documentation
    url: https://www.diffbot.com/docs/crawl/search
  - type: APIReference
    url: https://www.diffbot.com/docs/crawl/search
  description: >-
    The Diffbot Crawl/Bulk Job API is a powerful tool that allows users to automatically extract and
    organize large amounts of web data. It enables users to create custom scraping jobs that can
    gather information from multiple websites in a structured and organized manner.
