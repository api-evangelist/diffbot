- aid: diffbot:diffbot-web-search-api
  name: Diffbot Web Search API
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/diffbot.png
  baseURL: https://llm.diffbot.com/api/v1/web_search
  humanURL: https://www.diffbot.com/docs/web-search/
  tags:
  - Search
  - Web
  - Index
  - Retrieval
  properties:
  - type: OpenAPI
    url: openapi/_original/diffbot-web-search-openapi.json
  - type: Overlay
    url: overlays/diffbot-web-search-overlay.yaml
  - type: Documentation
    url: https://www.diffbot.com/docs/web-search/
  - type: APIReference
    url: https://www.diffbot.com/docs/web-search/get
  description: >-
    Search Diffbot's own web index — the largest independently crawled index outside Google and
    Bing, over 150TB. Candidates are retrieved and reranked by a cross-encoder trained to favour
    factual relevance over popularity and primary sources over secondary ones, and the most relevant
    chunk of each page is returned inline for citation. This is the one Diffbot surface that
    authenticates with an Authorization Bearer header rather than a token query parameter.
- aid: diffbot:diffbot-account-api
  name: Diffbot Account API
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/diffbot.png
  baseURL: https://api.diffbot.com/v4
  humanURL: https://www.diffbot.com/docs/account
