apis:
- aid: diffbot:diffbot-extract-api
  name: Diffbot Extract API
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/diffbot.png
  baseURL: https://api.diffbot.com/v3
  humanURL: https://www.diffbot.com/docs/extract/
  tags:
  - Extraction
  - Harvesting
  - Scraping
  - Web
  properties:
  - type: OpenAPI
    url: openapi/_original/diffbot-extract-openapi.json
  - type: OpenAPI
    name: Refined one-per-tag split
    url: openapi/diffbot-extract-api-openapi.yml
  - type: Overlay
    url: overlays/diffbot-extract-overlay.yaml
  - type: Documentation
    url: https://www.diffbot.com/docs/extract/
  - type: APIReference
    url: https://www.diffbot.com/docs/extract/analyze
  description: >-
    Diffbot Extract API is a powerful tool that allows users to automatically extract multiple types of
    data from web pages. This API is capable of extracting information such as article text, author details,
    images, and even product prices from a variety of websites.
- aid: diffbot:diffbot-crawl-api
  name: Diffbot Crawl API
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/diffbot.png
  baseURL: https://api.diffbot.com/v3
  humanURL: https://www.diffbot.com/docs/crawl/
  tags:
  - Crawling
  - Extraction
  - Harvesting
  - Scraping
  properties:
  - type: OpenAPI
    url: openapi/_original/diffbot-crawl-openapi.json
  - type: OpenAPI
    name: Refined one-per-tag split
    url: openapi/diffbot-crawl-api-openapi.yml
  - type: Overlay
    url: overlays/diffbot-crawl-overlay.yaml
  - type: Documentation
    url: https://www.diffbot.com/docs/crawl/
  - type: APIReference
    url: https://www.diffbot.com/docs/crawl/create
  description: >-
    Diffbot Crawl API is a powerful tool that automates the process of extracting content and data from
    websites on a large scale. By using advanced machine learning algorithms, the API can analyze and
    extract information from web pages with speed and accuracy.
- aid: diffbot:diffbot-natural-language-api
  name: Diffbot Natural Language API
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/diffbot.png
  baseURL: https://nl.diffbot.com
  humanURL: https://www.diffbot.com/docs/natural-language/
  tags:
  - Extraction
  - Harvesting
  - Language
  - Scraping
  properties:
  - type: OpenAPI
    url: openapi/_original/diffbot-natural-language-openapi.json
  - type: OpenAPI
    name: Refined one-per-tag split
    url: openapi/diffbot-natural-language-api-openapi.yml
  - type: Overlay
    url: overlays/diffbot-natural-language-overlay.yaml
  - type: Documentation
    url: https://www.diffbot.com/docs/natural-language/
  - type: APIReference
    url: https://www.diffbot.com/docs/natural-language/process-text
  description: >-
    Diffbot Natural Language API allows users to extract and analyze textual content from websites. By
    utilizing advanced natural language processing algorithms, the API can automatically identify and
    extract valuable information such as article titles, authors, publication dates, and key entities
    mentioned in the text.
- aid: diffbot:diffbot-knowledge-graph-api
  name: Diffbot Knowledge Graph API
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/diffbot.png
  baseURL: https://kg.diffbot.com/kg/v3
  humanURL: https://www.diffbot.com/docs/ontology/
  tags:
  - Knowledge Graph
  - Entities
  - Ontology
  - Linked Data
  properties:
  - type: OpenAPI
    name: Refined one-per-tag split
    url: openapi/diffbot-knowledge-graph-api-openapi.yml
  - type: DataModel
    url: data-model/diffbot-data-model.yml
  - type: Documentation
    url: https://www.diffbot.com/docs/ontology/
  - type: APIReference
    url: https://www.diffbot.com/docs/ontology/all-entities
  description: >-
    The Knowledge Graph itself — a linked graph of over 10 billion entities (organizations, people, articles,
    places, products, job posts and more) crawled and structured from the public web. It is reached through
    two contracts, the DQL API for structured search and the Enhance API for single-entity enrichment,
    over a shared ontology. Entities carry first-class provenance and quality fields (confidence, salience,
    importance, origin, nbIncomingEdges, crawlTimestamp, sources) and are classified against NACE Rev
    2.1, NAICS, ISO 3166 and IAB taxonomies. The entity shapes are documented as reference pages rather
    than declared as schemas in the published OpenAPI.
- aid: diffbot:diffbot-crawlbulk-job-api
  name: Diffbot Crawl/Bulk Job API
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/diffbot.png
  baseURL: https://api.diffbot.com/v3
  humanURL: https://www.diffbot.com/docs/crawl/search
  tags:
  - Bulk
  - Crawling
  - Extraction
  - Harvesting
  - Scraping
  properties:
  - type: Documentation
    url: https://www.diffbot.com/docs/crawl/search
  - type: APIReference
    url: https://www.diffbot.com/docs/crawl/search
  description: >-
    The Diffbot Crawl/Bulk Job API is a powerful tool that allows users to automatically extract and organize
    large amounts of web data. It enables users to create custom scraping jobs that can gather information
    from multiple websites in a structured and organized manner.
