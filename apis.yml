  - type: Documentation
    url: https://www.diffbot.com/docs/account
  - type: APIReference
    url: https://www.diffbot.com/docs/account
  description: >-
    Retrieve account details, plan, token metadata and usage activity for a Diffbot token. The only
    introspection surface Diffbot publishes: because the APIs return no rate-limit or quota response
    headers, this endpoint is how a client discovers how much of its credit allotment it has spent.
- aid: diffbot:diffbot-knowledge-graph-api
  name: Diffbot Knowledge Graph API
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/diffbot.png
  baseURL: https://kg.diffbot.com/kg/v3
  humanURL: https://www.diffbot.com/docs/ontology/
  tags:
  - Knowledge Graph
  - Entities
  - Ontology
  - Linked Data
  properties:
  - type: OpenAPI
    name: Refined one-per-tag split
    url: openapi/diffbot-knowledge-graph-api-openapi.yml
  - type: DataModel
    url: data-model/diffbot-data-model.yml
  - type: Documentation
    url: https://www.diffbot.com/docs/ontology/
  - type: APIReference
    url: https://www.diffbot.com/docs/ontology/all-entities
  description: >-
    The Knowledge Graph itself — a linked graph of over 10 billion entities (organizations, people,
    articles, places, products, job posts and more) crawled and structured from the public web. It is
    reached through two contracts, the DQL API for structured search and the Enhance API for
    single-entity enrichment, over a shared ontology. Entities carry first-class provenance and quality
    fields (confidence, salience, importance, origin, nbIncomingEdges, crawlTimestamp, sources) and are
    classified against NACE Rev 2.1, NAICS, ISO 3166 and IAB taxonomies. The entity shapes are
    documented as reference pages rather than declared as schemas in the published OpenAPI.
