generated: '2026-09-06'
method: derived
source: >-
  Derived from the components.schemas / definitions blocks of
  openapi/_original/diffbot-natural-language-openapi.json (19 schemas),
  diffbot-enhance-openapi.json (20), diffbot-dql-openapi.json (9) and
  diffbot-web-search-openapi.json (3), cross-read against the entity reference at
  https://www.diffbot.com/docs/ontology/ and the taxonomies at
  https://www.diffbot.com/docs/taxonomy/.
provider: Diffbot
providerId: diffbot
description: >-
  Diffbot's data model has two layers that the specs expose unevenly. The API-transport layer
  (request/response envelopes, job records, error shapes) is fully typed in the published
  OpenAPI. The Knowledge Graph ENTITY layer — the actual product — is typed as an opaque
  JSON node in every spec and documented only as human-readable ontology pages. That
  asymmetry is the central finding here and is recorded rather than papered over.
identifier_scheme:
  primary: diffbotUri
  format: A Diffbot URI naming a Knowledge Graph entity, e.g. http://diffbot.com/entity/<id>
  secondary:
    - name: id
      note: Bare entity id, accepted by Enhance via the IdRequestEntity shape.
    - name: allUris
      note: >-
        Cross-references to the same entity in other identifier systems; entity types
        additionally carry a dbpediaUri, which is a real linked-data anchor.
  docs: https://www.diffbot.com/docs/dql/concepts/entity-id-and-diffboturi
typed_entities:
  note: >-
    These are declared as schemas in a published spec, so an agent can rely on their shape.
  entities:
    - name: EntityWithMentions
      spec: openapi/_original/diffbot-natural-language-openapi.json
      fields: [name, diffbotUri, confidence, salience, sentiment, allUris, allTypes, mentions, location]
    - name: Entity
      spec: openapi/_original/diffbot-natural-language-openapi.json
      fields: [name, diffbotUri, confidence, allUris, allTypes, isCustom, entityIndex]
    - name: Fact
      spec: openapi/_original/diffbot-natural-language-openapi.json
      fields: [humanReadable, entity, property, value, qualifiers, confidence, evidence]
    - name: Property
      spec: openapi/_original/diffbot-natural-language-openapi.json
      fields: [name, diffbotUri, description]
    - name: EntityType
      spec: openapi/_original/diffbot-natural-language-openapi.json
      fields: [name, diffbotUri, dbpediaUri]
    - name: Mention
      spec: openapi/_original/diffbot-natural-language-openapi.json
      fields: [text, beginOffset, endOffset, isPronoun, confidence]
    - name: Evidence
      spec: openapi/_original/diffbot-natural-language-openapi.json
      fields: [passage, entityMentions, valueMentions]
    - name: Category / Categorization
      spec: openapi/_original/diffbot-natural-language-openapi.json
      fields: [id, name, path, confidence, isPrimary]
      note: Three parallel taxonomies — iabv1, iabv2 and Diffbot's own.
    - name: Location
      spec: openapi/_original/diffbot-natural-language-openapi.json
      fields: [latitude, longitude, precision]
    - name: BulkjobStatus
      spec: openapi/_original/diffbot-enhance-openapi.json
      fields: [job_id, name, refresh, search, message, jobs_total, jobs_completed, status, estimate_remaining_time]
    - name: Report
      spec: openapi/_original/diffbot-enhance-openapi.json
      fields: [reportId, status, format, spec, exportfile, exportSeparator, filter, onlyMatches]
    - name: DqlResponse
      spec: openapi/_original/diffbot-dql-openapi.json
      fields: [version, hits, results, kgversion, diffbot_type, facet, data, rewrites, textFallback]
    - name: EnhanceResponse
      spec: openapi/_original/diffbot-enhance-openapi.json
      fields: [version, hits, kgversion, request_ctx, data, errors, searchInfo]
