untyped_core:
  finding: >-
    The Knowledge Graph entity itself is NOT typed in any published spec. In
    diffbot-enhance-openapi.json the field Data.entity is an `ObjectNode` — an unconstrained
    JSON object — and in diffbot-dql-openapi.json Data.entity resolves to `JSONObject`, whose
    only declared property is `empty`. The Organization, Person, Article, Place, Product,
    JobPost, Event, Image, Video, Discussion, CreativeWork and Research entity shapes that
    the whole product is about exist as documentation pages, not as schemas.
  consequence: >-
    An agent can rely on the envelope and cannot rely on the payload. It must either read the
    ontology pages, or call the MCP `dql_ontology` tool, which is the only machine-readable
    route to the entity model (see mcp/diffbot-tool-crosswalk.yml — dql_ontology is MCP-only).
  documented_entity_types:
    - Organization
    - Person
    - Article
    - Place
    - Product
    - JobPost
    - Event
    - Image
    - Video
    - Discussion
    - CreativeWork
    - AdministrativeArea
    - LegalEntity
    - Research
    - Skills
  entity_docs: https://www.diffbot.com/docs/ontology/all-entities
  taxonomies:
    - name: Article categories
      url: https://www.diffbot.com/docs/taxonomy/article-categories
    - name: Organization categories
      url: https://www.diffbot.com/docs/taxonomy/organization-categories
    - name: Product categories
      url: https://www.diffbot.com/docs/taxonomy/product-categories
    - name: Employment categories
      url: https://www.diffbot.com/docs/taxonomy/employment-categories
    - name: Technology categories
      url: https://www.diffbot.com/docs/taxonomy/technology-categories
  external_classification_schemes:
    - NACE Rev 2.1
    - NAICS
    - ISO 3166
    - IAB v1 / IAB v2 content taxonomy
    - DBpedia (via EntityType.dbpediaUri)
quality_signals:
  note: >-
    Diffbot exposes provenance and confidence as first-class, documented fields — unusual and
    worth recording for a data provider.
  fields:
    - name: confidence
      docs: https://www.diffbot.com/docs/dql/concepts/confidence-score
    - name: salience
    - name: sentiment
    - name: importance
      docs: https://www.diffbot.com/docs/dql/concepts/importance
    - name: origin / nbOrigins
      docs: https://www.diffbot.com/docs/dql/concepts/origin
    - name: nbIncomingEdges
      docs: https://www.diffbot.com/docs/dql/concepts/nb-incoming-edges
    - name: crawlTimestamp
      docs: https://www.diffbot.com/docs/dql/concepts/crawl-timestamp
    - name: sources
      docs: https://www.diffbot.com/docs/dql/concepts/sources
